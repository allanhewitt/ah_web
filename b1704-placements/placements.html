<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B1704 Placement Opportunities 2026–27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy-dark:#16324a;
  --navy:#1f4e79;
  --navy-mid:#3a6b96;
  --tint:#eaf1f7;
  --paper:#fbfaf6;
  --ink:#24303a;
  --slate:#5b6a75;
  --amber:#b9722c;
  --line:#d7e1e8;
  --green:#3f7a5c;
  --green-tint:#e7f1ec;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.masthead{
  background:var(--navy-dark);
  color:#fff;
  padding:36px 24px;
}
.masthead-inner,.wrap,.footer-inner{
  max-width:1080px;
  margin:0 auto;
}
.kicker{
  margin:0 0 8px;
  color:#a9c3d8;
  font-size:.88rem;
  letter-spacing:.02em;
}
h1{
  font-family:'Source Serif 4',Georgia,serif;
  font-size:clamp(1.6rem,3.2vw,2.1rem);
  margin:0;
}
.wrap{padding:36px 24px 60px}

.org-section{
  margin:0 0 48px;
}
.org-section h2{
  font-family:'Source Serif 4',Georgia,serif;
  font-size:1.35rem;
  color:var(--navy-dark);
  margin:0 0 18px;
  padding-bottom:10px;
  border-bottom:1px solid var(--line);
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:20px;
}
.card{
  border:1px solid var(--line);
  background:#fff;
  padding:20px;
  display:flex;
  flex-direction:column;
}
.card-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin:0 0 4px;
}
.card-head h3{
  margin:0;
  font-family:'Source Serif 4',Georgia,serif;
  font-size:1.15rem;
  color:var(--navy-dark);
}
.squad{
  margin:0 0 12px;
  color:var(--amber);
  font-size:.82rem;
  font-weight:600;
}
.deliver{
  background:var(--tint);
  border-left:3px solid var(--navy);
  padding:10px 12px;
  font-size:.88rem;
  color:var(--navy-dark);
  margin:0 0 14px;
}
.deliver strong{
  display:block;
  color:var(--navy);
  font-size:.74rem;
  text-transform:uppercase;
  letter-spacing:.03em;
  margin-bottom:3px;
}
.meta{
  margin:auto 0 0;
  padding-top:12px;
  border-top:1px solid var(--line);
  font-size:.85rem;
}
.meta-row{
  display:flex;
  gap:8px;
  padding:3px 0;
}
.meta-row dt{
  flex:0 0 82px;
  color:var(--slate);
  font-weight:600;
  font-size:.76rem;
  text-transform:uppercase;
  letter-spacing:.02em;
}
.meta-row dd{
  margin:0;
  color:var(--ink);
}
.meta-row a{color:var(--navy)}

.badge{
  display:inline-block;
  padding:3px 9px;
  font-size:.74rem;
  font-weight:600;
  border-radius:2px;
  white-space:nowrap;
}
.badge.open{background:var(--green-tint);color:var(--green)}
.badge.filled{background:var(--line);color:var(--slate)}

.muted{color:var(--slate);font-style:italic}

footer{
  border-top:1px solid var(--line);
  padding:18px 24px 32px;
  color:var(--slate);
  font-size:.86rem;
}
footer a{color:var(--navy)}
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <p class="kicker">B1704 Professional Placement in Sport Data Analytics</p>
    <h1>Placement opportunities, 2026–27</h1>
  </div>
</header>

<main class="wrap" id="placements">
  <p class="muted">Loading placements&hellip;</p>
</main>

<footer>
  <div class="footer-inner">Further placements added as confirmed &middot; Questions: <a href="mailto:allan.hewitt@strath.ac.uk">allan.hewitt@strath.ac.uk</a></div>
</footer>

<script>
async function loadPlacements(){
  const container = document.getElementById('placements');
  let data;
  try{
    const res = await fetch('placements.json');
    data = (await res.json()).placements;
  }catch(err){
    container.innerHTML = '<p class="muted">Placements could not be loaded.</p>';
    return;
  }

  const groups = new Map();
  for(const p of data){
    if(!groups.has(p.organisation)) groups.set(p.organisation, []);
    groups.get(p.organisation).push(p);
  }

  const formatDate = iso => {
    if(!iso) return null;
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
  };

  container.innerHTML = '';
  for(const [org, rows] of groups){
    const section = document.createElement('section');
    section.className = 'org-section';
    section.innerHTML = `<h2>${org}</h2>`;

    const cardsWrap = document.createElement('div');
    cardsWrap.className = 'cards';

    for(const p of rows){
      const deadlineText = formatDate(p.deadline);
      const contactHtml = p.contactEmail
        ? `${p.contactName}, <a href="mailto:${p.contactEmail}">${p.contactEmail}</a>`
        : p.contactName;
      const squadLine = [p.sport, p.squad].filter(Boolean).join(' · ');
      const statusLabel = p.status.charAt(0).toUpperCase() + p.status.slice(1);

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-head">
          <h3>${p.focus ?? '<span class="muted">To be discussed</span>'}</h3>
          <span class="badge ${p.status}">${statusLabel}</span>
        </div>
        <p class="squad">${squadLine || '-'}</p>
        <div class="deliver">
          <strong>Deliverable</strong>
          ${p.deliverable ?? '<span class="muted">To be agreed with the organisation</span>'}
        </div>
        <dl class="meta">
          <div class="meta-row"><dt>Contact</dt><dd>${contactHtml}</dd></div>
          <div class="meta-row"><dt>Next steps</dt><dd>${p.nextSteps ?? '-'}</dd></div>
          <div class="meta-row"><dt>Deadline</dt><dd>${deadlineText ?? 'Rolling'}</dd></div>
        </dl>
      `;
      cardsWrap.appendChild(card);
    }

    section.appendChild(cardsWrap);
    container.appendChild(section);
  }
}

loadPlacements();
</script>

</body>
</html>
