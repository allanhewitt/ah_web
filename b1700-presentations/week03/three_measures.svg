<svg viewBox="0 0 1512 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">

  <!-- Total sprints card -->
  <g>
    <rect x="10" y="10" width="482" height="320" rx="12" fill="#F6F6F5" stroke="#DADCDE" stroke-width="1.5"/>
    <rect x="10" y="10" width="482" height="8" rx="4" fill="#6B7078"/>
    <text x="50" y="70" font-size="15" font-weight="700" letter-spacing="2" fill="#6B7078">MEASURE</text>
    <text x="50" y="106" font-size="26" font-weight="700" fill="#16191C">Total sprints</text>
    <rect x="50" y="140" width="402" height="70" rx="8" fill="#ffffff" stroke="#E4E6E8" stroke-width="1"/>
    <text x="80" y="168" font-size="16" fill="#3A3F44">Sums every sprint in the</text>
    <text x="80" y="190" font-size="16" fill="#3A3F44">appearances included.</text>
    <text x="50" y="248" font-size="16" fill="#6B7078">Ignores playing time entirely.</text>
    <text x="50" y="272" font-size="16" fill="#6B7078">A venue with more minutes</text>
    <text x="50" y="296" font-size="16" fill="#6B7078">played will look busier.</text>
  </g>

  <!-- Mean per appearance card -->
  <g transform="translate(512,0)">
    <rect x="10" y="10" width="482" height="320" rx="12" fill="#F6F6F5" stroke="#DADCDE" stroke-width="1.5"/>
    <rect x="10" y="10" width="482" height="8" rx="4" fill="#6B7078"/>
    <text x="50" y="70" font-size="15" font-weight="700" letter-spacing="2" fill="#6B7078">MEASURE</text>
    <text x="50" y="106" font-size="24" font-weight="700" fill="#16191C">Mean sprints</text>
    <text x="50" y="134" font-size="24" font-weight="700" fill="#16191C">per appearance</text>
    <rect x="50" y="160" width="402" height="50" rx="8" fill="#ffffff" stroke="#E4E6E8" stroke-width="1"/>
    <text x="80" y="190" font-size="16" fill="#3A3F44">Averages across appearances.</text>
    <text x="50" y="248" font-size="16" fill="#6B7078">Still does not adjust for how</text>
    <text x="50" y="272" font-size="16" fill="#6B7078">long each player was actually</text>
    <text x="50" y="296" font-size="16" fill="#6B7078">on the pitch.</text>
  </g>

  <!-- Sprints per 90 card -->
  <g transform="translate(1014,0)">
    <rect x="10" y="10" width="488" height="320" rx="12" fill="#F6F6F5" stroke="#DADCDE" stroke-width="1.5"/>
    <rect x="10" y="10" width="488" height="8" rx="4" fill="#6B7078"/>
    <text x="50" y="70" font-size="15" font-weight="700" letter-spacing="2" fill="#6B7078">MEASURE</text>
    <text x="50" y="106" font-size="26" font-weight="700" fill="#16191C">Sprints per 90</text>
    <rect x="50" y="140" width="408" height="70" rx="8" fill="#ffffff" stroke="#E4E6E8" stroke-width="1"/>
    <text x="80" y="168" font-size="16" fill="#3A3F44">sprints / minutes_played * 90</text>
    <text x="80" y="190" font-size="16" fill="#3A3F44">An exposure-adjusted rate.</text>
    <text x="50" y="248" font-size="16" fill="#6B7078">Accounts for how long each</text>
    <text x="50" y="272" font-size="16" fill="#6B7078">player was actually on the</text>
    <text x="50" y="296" font-size="16" fill="#6B7078">pitch.</text>
  </g>
</svg>

