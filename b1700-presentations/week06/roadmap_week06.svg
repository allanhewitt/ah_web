<svg viewBox="0 0 1500 190" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="rm-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#9BA0A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <line x1="228" y1="70" x2="272" y2="70" stroke="#DADCDE" stroke-width="2" marker-end="url(#rm-arrow)"/>
  <line x1="468" y1="70" x2="512" y2="70" stroke="#DADCDE" stroke-width="2" marker-end="url(#rm-arrow)"/>
  <line x1="708" y1="70" x2="752" y2="70" stroke="#DADCDE" stroke-width="2" marker-end="url(#rm-arrow)"/>
  <line x1="948" y1="70" x2="992" y2="70" stroke="#DADCDE" stroke-width="2" marker-end="url(#rm-arrow)"/>
  <line x1="1188" y1="70" x2="1232" y2="70" stroke="#DADCDE" stroke-width="2" marker-end="url(#rm-arrow)"/>

  <!-- 1 UNDERSTAND -->
  <rect x="8" y="20" width="220" height="100" rx="10" fill="#F6F6F5" stroke="#DADCDE" stroke-width="1.5"/>
  <text x="118" y="65" text-anchor="middle" font-size="22" font-weight="700" fill="#6B7078">UNDERSTAND</text>
  <text x="118" y="92" text-anchor="middle" font-size="15" fill="#9BA0A6">Week 1</text>

  <!-- 2 TRUST -->
  <rect x="248" y="20" width="220" height="100" rx="10" fill="#F6F6F5" stroke="#DADCDE" stroke-width="1.5"/>
  <text x="358" y="65" text-anchor="middle" font-size="22" font-weight="700" fill="#6B7078">TRUST</text>
  <text x="358" y="92" text-anchor="middle" font-size="15" fill="#9BA0A6">Week 2</text>

  <!-- 3 TRANSFORM -->
  <rect x="488" y="20" width="220" height="100" rx="10" fill="#F6F6F5" stroke="#DADCDE" stroke-width="1.5"/>
  <text x="598" y="65" text-anchor="middle" font-size="22" font-weight="700" fill="#6B7078">TRANSFORM</text>
  <text x="598" y="92" text-anchor="middle" font-size="15" fill="#9BA0A6">Week 3</text>

  <!-- 4 CLEAN -->
  <rect x="728" y="20" width="220" height="100" rx="10" fill="#F6F6F5" stroke="#DADCDE" stroke-width="1.5"/>
  <text x="838" y="65" text-anchor="middle" font-size="22" font-weight="700" fill="#6B7078">CLEAN</text>
  <text x="838" y="92" text-anchor="middle" font-size="15" fill="#9BA0A6">Week 4</text>

  <!-- 5 CONNECT -->
  <rect x="968" y="20" width="220" height="100" rx="10" fill="#F6F6F5" stroke="#DADCDE" stroke-width="1.5"/>
  <text x="1078" y="65" text-anchor="middle" font-size="22" font-weight="700" fill="#6B7078">CONNECT</text>
  <text x="1078" y="92" text-anchor="middle" font-size="15" fill="#9BA0A6">Week 5</text>

  <!-- 6 DESCRIBE & COMMUNICATE (current week - solid) -->
  <rect x="1208" y="20" width="284" height="100" rx="10" fill="#16191C"/>
  <text x="1350" y="57" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">DESCRIBE &amp;</text>
  <text x="1350" y="80" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">COMMUNICATE</text>
  <text x="1350" y="104" text-anchor="middle" font-size="15" fill="#C7CCCF">Week 6</text>
</svg>

