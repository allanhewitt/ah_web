<svg viewBox="0 0 1520 330" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <g transform="translate(4,0)">
    <rect x="0" y="6" width="284" height="318" rx="12" fill="#F6F6F5" stroke="#DADCDE" stroke-width="1.5"/>
    <rect x="0" y="6" width="284" height="9" rx="4" fill="#16191C"/>
    <text x="22" y="62" font-size="17" font-weight="700" letter-spacing="2" fill="#6B7078">PROBLEM 1</text>
    <text x="22" y="106" font-size="28" font-weight="700" fill="#16191C">Missing</text>
    <text x="22" y="140" font-size="28" font-weight="700" fill="#16191C">values</text>
    <rect x="22" y="190" width="240" height="106" rx="8" fill="#ffffff" stroke="#E4E6E8" stroke-width="1"/>
    <text x="34" y="232" font-size="19" fill="#6B7078">NA in a column</text>
    <text x="34" y="266" font-size="19" fill="#6B7078">a gap in the record</text>
  </g>
  <g transform="translate(311,0)">
    <rect x="0" y="6" width="284" height="318" rx="12" fill="#F6F6F5" stroke="#DADCDE" stroke-width="1.5"/>
    <rect x="0" y="6" width="284" height="9" rx="4" fill="#16191C"/>
    <text x="22" y="62" font-size="17" font-weight="700" letter-spacing="2" fill="#6B7078">PROBLEM 2</text>
    <text x="22" y="106" font-size="28" font-weight="700" fill="#16191C">Implausible and</text>
    <text x="22" y="140" font-size="28" font-weight="700" fill="#16191C">extreme values</text>
    <rect x="22" y="190" width="240" height="106" rx="8" fill="#ffffff" stroke="#E4E6E8" stroke-width="1"/>
    <text x="34" y="232" font-size="19" fill="#6B7078">-99 km; 200.5 km</text>
    <text x="34" y="266" font-size="19" fill="#6B7078">presence ≠ validity</text>
  </g>
  <g transform="translate(618,0)">
    <rect x="0" y="6" width="284" height="318" rx="12" fill="#F6F6F5" stroke="#DADCDE" stroke-width="1.5"/>
    <rect x="0" y="6" width="284" height="9" rx="4" fill="#16191C"/>
    <text x="22" y="62" font-size="17" font-weight="700" letter-spacing="2" fill="#6B7078">PROBLEM 3</text>
    <text x="22" y="106" font-size="28" font-weight="700" fill="#16191C">Duplicates</text>
    <text x="22" y="140" font-size="28" font-weight="700" fill="#16191C">relative to grain</text>
    <rect x="22" y="190" width="240" height="106" rx="8" fill="#ffffff" stroke="#E4E6E8" stroke-width="1"/>
    <text x="34" y="232" font-size="19" fill="#6B7078">repeated player_id</text>
    <text x="34" y="266" font-size="19" fill="#6B7078">is expected, not an error</text>
  </g>
  <g transform="translate(925,0)">
    <rect x="0" y="6" width="284" height="318" rx="12" fill="#F6F6F5" stroke="#DADCDE" stroke-width="1.5"/>
    <rect x="0" y="6" width="284" height="9" rx="4" fill="#16191C"/>
    <text x="22" y="62" font-size="17" font-weight="700" letter-spacing="2" fill="#6B7078">PROBLEM 4</text>
    <text x="22" y="106" font-size="28" font-weight="700" fill="#16191C">Inconsistent</text>
    <text x="22" y="140" font-size="28" font-weight="700" fill="#16191C">labels</text>
    <rect x="22" y="190" width="240" height="106" rx="8" fill="#ffffff" stroke="#E4E6E8" stroke-width="1"/>
    <text x="34" y="232" font-size="19" fill="#6B7078">&quot;Forward&quot; / &quot;forward&quot;</text>
    <text x="34" y="266" font-size="19" fill="#6B7078">/ &quot; FWD &quot;: one category</text>
  </g>
  <g transform="translate(1232,0)">
    <rect x="0" y="6" width="284" height="318" rx="12" fill="#F6F6F5" stroke="#DADCDE" stroke-width="1.5"/>
    <rect x="0" y="6" width="284" height="9" rx="4" fill="#16191C"/>
    <text x="22" y="62" font-size="17" font-weight="700" letter-spacing="2" fill="#6B7078">PROBLEM 5</text>
    <text x="22" y="106" font-size="28" font-weight="700" fill="#16191C">Wide structure</text>
    <text x="22" y="140" font-size="28" font-weight="700" fill="#16191C">needs long form</text>
    <rect x="22" y="190" width="240" height="106" rx="8" fill="#ffffff" stroke="#E4E6E8" stroke-width="1"/>
    <text x="34" y="232" font-size="19" fill="#6B7078">one column per week</text>
    <text x="34" y="266" font-size="19" fill="#6B7078">makes grouping hard</text>
  </g>
</svg>
