name: Build B1700 presentations
on:
  push:
    branches: [main]
    paths:
      - 'b1700-presentations/**'
      - '.github/workflows/build-b1700-presentations.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render six standalone presentations
        shell: bash
        run: |
          set -euo pipefail
          for source in b1700-presentations/week*/week*_slides.qmd; do
            quarto render "$source" --to revealjs
            output="${source%.qmd}.html"
            test -s "$output"
          done
      - name: Commit compiled HTML
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add b1700-presentations/week*/week*_slides.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish rendered B1700 presentations"
            git push
          fi
